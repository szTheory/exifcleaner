name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: Lint, Typecheck & Test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # One composed source gate owns release-note identity, known-gap policy,
      # docs/i18n drift, formatting, types, unit tests, directory effects, and
      # dependency cycles. Keep these checks single-run before expensive E2E/builds.
      - name: Release source gate
        run: yarn verify:release

      - name: Compile (electron-vite build)
        run: yarn compile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Disable AppArmor restriction (Ubuntu 24.04)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: E2E tests (Playwright)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" yarn test:e2e

  build-macos:
    name: Build macOS
    needs: test
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Signed/notarized path deleted deliberately. ExifCleaner ships unsigned
      # with an ad-hoc signature (scripts/afterPack.cjs). Apple notarization
      # requires a paid Developer ID whose certificate embeds the holder's legal
      # name in the Gatekeeper dialog, which is incompatible with this project's
      # anonymity. Keeping the dead path around meant a step labelled "signed +
      # notarized" that actually produced unsigned artifacts, plus a latent bug
      # (APPLE_API_KEY used a literal unexpanded "~").
      # See SIGNING-SETUP.md if this is ever revisited.
      - name: Build macOS artifacts
        run: yarn packmac

      - name: macOS xattr E2E
        run: yarn playwright test tests/e2e/xattr.spec.ts --project=dev

      # Smoke runs in the SAME job as the build: upload-artifact normalizes file
      # modes to 644 and drops symlinks, so an unpacked .app cannot cross a job
      # boundary intact. Only the sealed .dmg does.
      - name: Install from DMG
        id: install
        run: |
          ARTIFACT=$(find dist -maxdepth 1 -name "*arm64.dmg" -print -quit)
          test -n "$ARTIFACT"
          APP=$(scripts/smoke/install-macos.sh "$ARTIFACT" "$RUNNER_TEMP/smoke")
          # See ci.yml: $APP is <bundle>.app/Contents/MacOS/<name>, so chained
          # dirnames are off by one and yield a path codesign cannot verify.
          {
            echo "artifact=$ARTIFACT"
            echo "executable=$APP"
            echo "bundle=${APP%/Contents/MacOS/*}"
          } >> "$GITHUB_OUTPUT"

      - name: Gatekeeper gate
        run: node scripts/gatekeeper_check.mjs --app "${{ steps.install.outputs.bundle }}"

      - name: Smoke test packaged app
        env:
          EXIFCLEANER_PACKAGED_APP: ${{ steps.install.outputs.executable }}
        run: yarn test:smoke

      - name: Write macOS release evidence
        run: yarn release:evidence --artifact "${{ steps.install.outputs.artifact }}" --executable "${{ steps.install.outputs.executable }}" --runner-os macos --runner-arch "${{ runner.arch }}" --smoke-result passed --output release-evidence-macos.json

      - name: Upload macOS release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-macos
          path: release-evidence-macos.json
          retention-days: 7

      - name: Upload smoke report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-report-macos
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: dist/*.dmg
          retention-days: 30

  build-windows:
    name: Build Windows
    needs: test
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Windows artifacts
        run: yarn packwin

      # nsis.runAfterFinish:false stops the silent install auto-launching the app;
      # the install script also stops any stray instance. Without both, Playwright's
      # launch becomes a second instance that hangs on the single-instance lock.
      - name: Install from NSIS installer
        id: install
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter "*Setup*.exe" | Select-Object -First 1
          if ($null -eq $installer) { throw "No NSIS installer found in dist" }
          $app = ./scripts/smoke/install-windows.ps1 -DistDir dist
          "artifact=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "executable=$app" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Smoke test packaged app
        env:
          EXIFCLEANER_PACKAGED_APP: ${{ steps.install.outputs.executable }}
        run: yarn test:smoke

      - name: Write Windows release evidence
        run: yarn release:evidence --artifact "${{ steps.install.outputs.artifact }}" --executable "${{ steps.install.outputs.executable }}" --runner-os windows --runner-arch "${{ runner.arch }}" --smoke-result passed --output release-evidence-windows.json

      - name: Upload Windows release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-windows
          path: release-evidence-windows.json
          retention-days: 7

      - name: Upload smoke report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-report-windows
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: dist/*.exe
          retention-days: 30

  build-linux:
    name: Build Linux
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Linux artifacts
        run: yarn packlinux

      # Same AppArmor workaround the dev E2E job needs — the packaged app runs the
      # same Chromium renderer.
      - name: Disable AppArmor restriction (Ubuntu 24.04)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Extract AppImage
        id: install
        run: |
          ARTIFACT=$(find dist -maxdepth 1 -name "*.AppImage" -print -quit)
          test -n "$ARTIFACT"
          APP=$(scripts/smoke/install-linux.sh "$ARTIFACT" "$RUNNER_TEMP/smoke")
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "executable=$APP" >> "$GITHUB_OUTPUT"

      - name: Smoke test packaged app
        env:
          EXIFCLEANER_PACKAGED_APP: ${{ steps.install.outputs.executable }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" yarn test:smoke

      - name: Write Linux release evidence
        run: yarn release:evidence --artifact "${{ steps.install.outputs.artifact }}" --executable "${{ steps.install.outputs.executable }}" --runner-os linux --runner-arch "${{ runner.arch }}" --smoke-result passed --output release-evidence-linux.json

      - name: Upload Linux release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-linux
          path: release-evidence-linux.json
          retention-days: 7

      - name: Upload smoke report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-report-linux
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          retention-days: 30

  release:
    name: Create Release
    needs: [build-macos, build-windows, build-linux]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download native release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-evidence-*
          path: release-evidence
          merge-multiple: true

      - name: Validate native release evidence
        run: yarn verify:release-evidence release-evidence

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Validate exact release asset inventory
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          expected=(
            "artifacts/release-macos/ExifCleaner-${version}-arm64.dmg"
            "artifacts/release-macos/ExifCleaner-${version}.dmg"
            "artifacts/release-windows/ExifCleaner.${version}.exe"
            "artifacts/release-windows/ExifCleaner.Setup.${version}.exe"
            "artifacts/release-linux/ExifCleaner-${version}.AppImage"
            "artifacts/release-linux/exifcleaner_${version}_amd64.deb"
            "artifacts/release-linux/exifcleaner-${version}.x86_64.rpm"
          )

          for asset in "${expected[@]}"; do
            test -s "$asset" || {
              echo "::error::Missing or empty expected release asset: $asset"
              exit 1
            }
          done

          total=$(find artifacts/release-macos artifacts/release-windows artifacts/release-linux -maxdepth 1 -type f | wc -l | tr -d ' ')
          test "$total" -eq 7
          file "${expected[2]}" | grep -q 'PE32'
          dpkg-deb --info "${expected[5]}" >/dev/null
          file "${expected[6]}" | grep -q 'RPM'
          printf '%s\n' "${expected[@]}"

      - name: Generate SHASUMS256.txt
        run: |
          cd artifacts
          find . -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) -exec sha256sum {} \; | sed 's|  \./[^/]*/|  |' > ../SHASUMS256.txt
          cd ..
          cat SHASUMS256.txt

      - name: Get version
        id: version
        run: echo "version=v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      # Tag creation is deliberately outside workflow authority. The maintainer
      # must create the version tag at this exact commit before dispatching this
      # workflow, so a rerun can only draft a release for reviewed tagged source.
      - name: Verify pre-existing release tag
        run: |
          V="${{ steps.version.outputs.version }}"
          git fetch --tags --force
          if ! git rev-parse -q --verify "refs/tags/$V" >/dev/null; then
            echo "::error::Required release tag $V does not exist."
            exit 1
          fi

          EXISTING=$(git rev-parse "$V^{commit}")
          if [ "$EXISTING" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $V exists at $EXISTING but this run is $GITHUB_SHA."
            exit 1
          fi

          echo "Verified tag $V at $GITHUB_SHA."

      - name: Create draft release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ExifCleaner ${{ steps.version.outputs.version }}
          draft: true
          # body_path, NOT generate_release_notes. They are mutually exclusive, and
          # with autogeneration on, the hand-written notes — including the entire
          # macOS unsigned-bypass section users most need — never reach the page.
          body_path: RELEASE_NOTES.md
          # An artifact-name typo would otherwise silently publish a release with
          # no binaries, which is a worse failure mode than a red job.
          fail_on_unmatched_files: true
          files: |
            artifacts/release-macos/*
            artifacts/release-windows/*
            artifacts/release-linux/*
            SHASUMS256.txt
