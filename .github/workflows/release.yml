name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  promote:
    name: Audit and publish tested artifacts
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download native release evidence from tested CI run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-evidence-*
          path: release-evidence
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Download binaries from tested CI run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ExifCleaner-*
          path: release-assets
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Prepare and validate exact release assets and SHASUMS256.txt
        run: >-
          yarn release:prepare-assets
          --assets release-assets
          --evidence release-evidence
          --source-sha "$HEAD_SHA"
          --output promotion-manifest.json

      - name: Validate native package structure
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          file "release-assets/ExifCleaner.${version}.exe" | grep -q 'PE32'
          dpkg-deb --info "release-assets/exifcleaner_${version}_amd64.deb" >/dev/null
          file "release-assets/exifcleaner-${version}.x86_64.rpm" | grep -q 'RPM'

      - name: Get version
        id: version
        run: echo "tag=v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Create or verify exact version tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            existing=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
            test "$existing" = "$HEAD_SHA" || {
              echo "::error::Tag $TAG is bound to $existing, not tested commit $HEAD_SHA"
              exit 1
            }
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              --method POST \
              -f ref="refs/tags/$TAG" \
              -f sha="$HEAD_SHA" >/dev/null
          fi

      - name: Inspect release state
        id: state
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > existing-release.json 2>/dev/null; then
            draft=$(jq -r .draft existing-release.json)
            echo "already_published=$([ "$draft" = false ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update transient draft
        if: steps.state.outputs.already_published != 'true'
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ExifCleaner ${{ steps.version.outputs.tag }}
          draft: true
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: release-assets/*

      - name: Capture transient draft metadata
        if: steps.state.outputs.already_published != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release view "$TAG" --json isDraft,tagName,body,assets,url > transient-release.json

      - name: Audit transient draft
        if: steps.state.outputs.already_published != 'true'
        run: >-
          yarn verify:release-assets
          --assets release-assets
          --evidence release-evidence
          --source-sha "$HEAD_SHA"
          --release-json transient-release.json
          --release-notes RELEASE_NOTES.md
          --expected-draft true

      - name: Audit downloaded transient draft bytes
        if: steps.state.outputs.already_published != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir remote-release-assets
          gh release download "$TAG" --dir remote-release-assets
          yarn verify:release-assets --assets remote-release-assets --evidence release-evidence --source-sha "$HEAD_SHA"

      - name: Publish audited release
        if: steps.state.outputs.already_published != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id)
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            --method PATCH \
            -F draft=false \
            -F make_latest=true >/dev/null

      - name: Capture published release metadata
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release view "$TAG" --json isDraft,tagName,body,assets,url > published-release.json

      - name: Audit published release
        run: >-
          yarn verify:release-assets
          --assets release-assets
          --evidence release-evidence
          --source-sha "$HEAD_SHA"
          --release-json published-release.json
          --release-notes RELEASE_NOTES.md
          --expected-draft false

      - name: Audit downloaded published bytes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p published-release-assets
          gh release download "$TAG" --dir published-release-assets
          yarn verify:release-assets --assets published-release-assets --evidence release-evidence --source-sha "$HEAD_SHA"
