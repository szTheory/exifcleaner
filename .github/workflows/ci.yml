name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress runs for same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Phase 48 (D-04, D-19 step 7, D-20): the repository now pins the published registry
      # version exifcleaner-node@0.2.1, so this step is required to pass unconditionally.
      # `continue-on-error` (Phase 47) is removed here — Phase 47 added it deliberately to
      # keep this CI-linkage structural gate intact while the dependency was non-sealable;
      # that condition no longer holds. This step's run command and its placement
      # immediately after install remain the validated CI-linkage invariant
      # (scripts/exifcleaner_node_dependency_gate.mjs validateCiWorkflowPolicy).
      - name: Seal native dependency
        run: yarn verify:native-dependency:seal

      - name: Verify release-note identity
        run: yarn verify:release-notes

      - name: Oracle accountability policy
        run: yarn verify:accountability:policy

      - name: Known-gap gate
        run: yarn verify:known-gaps

      - name: Translation resource drift
        run: yarn i18n:check

      - name: Documentation drift
        run: yarn docs:verify

      - name: Lint (Prettier)
        run: yarn lint

      - name: Typecheck (tsc --noEmit)
        run: yarn typecheck

      # P48-NC-5 (issue #344 vacuity gate): must run before the NC evidence step below,
      # which reads this step's success marker as P48-NC-5's own run-log evidence.
      - name: Issue #344 vacuity gate
        run: yarn verify:issue344-vacuity

      - name: Unit tests (Vitest)
        run: yarn test:ci

      # D-11: proves the six P48-NC controls EXECUTED (not skipped/platform-gated), reading
      # the report the previous step just wrote plus the vacuity gate's evidence marker.
      - name: Issue #344 NC evidence
        run: yarn verify:issue344-nc-evidence
      # always() so the per-test-name run-log evidence (D-27 prerequisite) is
      # preserved even when a test fails, not only on a clean pass.
      - name: Upload Vitest run-log evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-report
          path: vitest-report.json
          retention-days: 7

      # D-27: asserts the nine negative-control titles were actually EXECUTED
      # in the report above, not merely that the suite exited zero. Placed
      # after the upload step (not always()) so the artifact is preserved
      # even when this assertion is what fails, but this step itself gates
      # the pipeline normally.
      - name: Verify negative-control run-log evidence
        run: yarn verify:nc-evidence

      - name: Check circular dependencies (madge)
        run: yarn check:deps

      - name: Directory-effect gate (dir_effect_gate)
        run: yarn verify:direffect

      - name: Compile (electron-vite build)
        run: yarn compile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Disable AppArmor restriction (Ubuntu 24.04)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Orientation mutation accountability
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" yarn verify:accountability:mutation

      - name: E2E tests (Playwright)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" yarn test:e2e

  build-macos:
    name: Build macOS
    needs: test
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # --publish never lives in the pack script so no caller can forget it.
      - name: Build macOS artifacts
        run: yarn packmac

      - name: macOS xattr E2E
        run: yarn playwright test tests/e2e/xattr.spec.ts --project=dev

      # Smoke runs in the SAME job as the build, deliberately.
      # actions/upload-artifact normalizes file modes to 644 and drops symlinks —
      # a .app is largely symlinks (Contents/Frameworks/*/Versions/Current) and
      # would arrive corrupted, producing phantom "damaged" verdicts. Only the
      # sealed .dmg crosses a job boundary.
      - name: Install from DMG
        id: install
        run: |
          ARTIFACT=$(find dist -maxdepth 1 -name "*arm64.dmg" -print -quit)
          test -n "$ARTIFACT"
          APP=$(scripts/smoke/install-macos.sh "$ARTIFACT" "$RUNNER_TEMP/smoke")
          # Strip the executable suffix rather than chaining dirname. $APP is
          # <bundle>.app/Contents/MacOS/<name>, so this needs three dirnames, and a
          # two-dirname version silently yielded ".../ExifCleaner.app/Contents" —
          # which codesign rejects as "bundle format unrecognized", making a healthy
          # build look like the "damaged" failure the gate exists to catch.
          {
            echo "artifact=$ARTIFACT"
            echo "executable=$APP"
            echo "bundle=${APP%/Contents/MacOS/*}"
          } >> "$GITHUB_OUTPUT"

      # Regression gate for #290. Operates on its own quarantined copy.
      - name: Gatekeeper gate
        run: node scripts/gatekeeper_check.mjs --app "${{ steps.install.outputs.bundle }}"

      - name: Smoke test packaged app
        env:
          EXIFCLEANER_PACKAGED_APP: ${{ steps.install.outputs.executable }}
        run: yarn test:smoke

      - name: Write macOS release evidence
        run: yarn release:evidence --artifact "${{ steps.install.outputs.artifact }}" --executable "${{ steps.install.outputs.executable }}" --runner-os macos --runner-arch "${{ runner.arch }}" --smoke-result passed --output release-evidence-macos.json

      - name: Upload macOS release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-macos
          path: release-evidence-macos.json
          retention-days: 7

      # always() so a smoke failure still leaves the artifact for debugging.
      - name: Upload macOS artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ExifCleaner-macOS
          path: dist/*.dmg
          retention-days: 7

      - name: Upload smoke report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-report-macos
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build-windows:
    name: Build Windows
    needs: test
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Windows artifacts
        run: yarn packwin

      # nsis.runAfterFinish:false stops the silent install auto-launching the app;
      # the install script also stops any stray instance. Without both, Playwright's
      # launch becomes a second instance that hangs on the single-instance lock.
      - name: Install from NSIS installer
        id: install
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter "*Setup*.exe" | Select-Object -First 1
          if ($null -eq $installer) { throw "No NSIS installer found in dist" }
          $app = ./scripts/smoke/install-windows.ps1 -DistDir dist
          "artifact=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "executable=$app" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # 48-07 diagnostic (maintainer-authorized, one deliberate dispatch): writes native
      # crash dumps to a local, job-scoped RUNNER_TEMP directory when the packaged app
      # dies. src/main/security/crash_dumps.ts's maybeEnableCrashDumps() is a no-op unless
      # this exact env var is set -- no real user launch or release build ever sets it.
      # uploadToServer:false + empty submitURL (verified by
      # tests/main/security/crash_dumps.test.ts) mean nothing is ever phoned home; the
      # dumps only ever leave this job as the CI artifact uploaded below.
      - name: Smoke test packaged app
        env:
          EXIFCLEANER_PACKAGED_APP: ${{ steps.install.outputs.executable }}
          EXIFCLEANER_CRASH_DUMPS_DIR: ${{ runner.temp }}\crash-dumps
        run: yarn test:smoke

      - name: Write Windows release evidence
        run: yarn release:evidence --artifact "${{ steps.install.outputs.artifact }}" --executable "${{ steps.install.outputs.executable }}" --runner-os windows --runner-arch "${{ runner.arch }}" --smoke-result passed --output release-evidence-windows.json

      - name: Upload Windows release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-windows
          path: release-evidence-windows.json
          retention-days: 7

      - name: Upload smoke report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-report-windows
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # Diagnostic-only, paired with the crash-dump capture above. Uploads whatever was
      # written to the crash-dumps directory (nothing, if the app never crashed) so a
      # native fault has a real minidump to analyze instead of only a Playwright
      # "context closed" symptom.
      - name: Upload Windows crash dumps
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-crash-dumps
          path: ${{ runner.temp }}\crash-dumps
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ExifCleaner-Windows
          path: |
            dist/*.exe
          retention-days: 7

  build-linux:
    name: Build Linux
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Linux artifacts
        run: yarn packlinux

      # Same AppArmor workaround the dev E2E job needs — the packaged app runs the
      # same Chromium renderer.
      - name: Disable AppArmor restriction (Ubuntu 24.04)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Extract AppImage
        id: install
        run: |
          ARTIFACT=$(find dist -maxdepth 1 -name "*.AppImage" -print -quit)
          test -n "$ARTIFACT"
          APP=$(scripts/smoke/install-linux.sh "$ARTIFACT" "$RUNNER_TEMP/smoke")
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "executable=$APP" >> "$GITHUB_OUTPUT"

      - name: Smoke test packaged app
        env:
          DBUS_SESSION_BUS_ADDRESS: ""
          EXIFCLEANER_PACKAGED_APP: ${{ steps.install.outputs.executable }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" yarn test:smoke

      - name: Write Linux release evidence
        run: yarn release:evidence --artifact "${{ steps.install.outputs.artifact }}" --executable "${{ steps.install.outputs.executable }}" --runner-os linux --runner-arch "${{ runner.arch }}" --smoke-result passed --output release-evidence-linux.json

      - name: Upload Linux release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-linux
          path: release-evidence-linux.json
          retention-days: 7

      - name: Upload smoke report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-report-linux
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ExifCleaner-Linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          retention-days: 7

  verify-native-evidence:
    name: Verify Native Release Evidence
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Download native release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-evidence-*
          path: release-evidence
          merge-multiple: true

      - name: Validate complete native evidence set
        run: node scripts/release_evidence.mjs --validate-set release-evidence
