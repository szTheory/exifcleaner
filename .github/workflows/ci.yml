name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel in-progress runs for same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Verify release-note identity
        run: yarn verify:release-notes

      - name: Known-gap gate
        run: yarn verify:known-gaps

      - name: Lint (Prettier)
        run: yarn lint

      - name: Typecheck (tsc --noEmit)
        run: yarn typecheck

      - name: Unit tests (Vitest)
        run: yarn test

      - name: Check circular dependencies (madge)
        run: yarn check:deps

      - name: Directory-effect gate (dir_effect_gate)
        run: yarn verify:direffect

      - name: Compile (electron-vite build)
        run: yarn compile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Disable AppArmor restriction (Ubuntu 24.04)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: E2E tests (Playwright)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" yarn test:e2e

  build-macos:
    name: Build macOS
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # --publish never lives in the pack script so no caller can forget it.
      - name: Build macOS artifacts
        run: yarn packmac

      - name: macOS xattr E2E
        run: yarn playwright test tests/e2e/xattr.spec.ts --project=dev

      # Smoke runs in the SAME job as the build, deliberately.
      # actions/upload-artifact normalizes file modes to 644 and drops symlinks —
      # a .app is largely symlinks (Contents/Frameworks/*/Versions/Current) and
      # would arrive corrupted, producing phantom "damaged" verdicts. Only the
      # sealed .dmg crosses a job boundary.
      - name: Install from DMG
        id: install
        run: |
          ARTIFACT=$(find dist -maxdepth 1 -name "*arm64.dmg" -print -quit)
          test -n "$ARTIFACT"
          APP=$(scripts/smoke/install-macos.sh "$ARTIFACT" "$RUNNER_TEMP/smoke")
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "executable=$APP" >> "$GITHUB_OUTPUT"
          # Strip the executable suffix rather than chaining dirname. $APP is
          # <bundle>.app/Contents/MacOS/<name>, so this needs three dirnames, and a
          # two-dirname version silently yielded ".../ExifCleaner.app/Contents" —
          # which codesign rejects as "bundle format unrecognized", making a healthy
          # build look like the "damaged" failure the gate exists to catch.
          echo "bundle=${APP%/Contents/MacOS/*}" >> "$GITHUB_OUTPUT"

      # Regression gate for #290. Operates on its own quarantined copy.
      - name: Gatekeeper gate
        run: node scripts/gatekeeper_check.mjs --app "${{ steps.install.outputs.bundle }}"

      - name: Smoke test packaged app
        env:
          EXIFCLEANER_PACKAGED_APP: ${{ steps.install.outputs.executable }}
        run: yarn test:smoke

      - name: Write macOS release evidence
        run: yarn release:evidence --artifact "${{ steps.install.outputs.artifact }}" --executable "${{ steps.install.outputs.executable }}" --runner-os macos --runner-arch "${{ runner.arch }}" --smoke-result passed --output release-evidence-macos.json

      - name: Upload macOS release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-macos
          path: release-evidence-macos.json
          retention-days: 7

      # always() so a smoke failure still leaves the artifact for debugging.
      - name: Upload macOS artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ExifCleaner-macOS
          path: dist/*.dmg
          retention-days: 7

      - name: Upload smoke report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-macos
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build-windows:
    name: Build Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Windows artifacts
        run: yarn packwin

      # nsis.runAfterFinish:false stops the silent install auto-launching the app;
      # the install script also stops any stray instance. Without both, Playwright's
      # launch becomes a second instance that hangs on the single-instance lock.
      - name: Install from NSIS installer
        id: install
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter "*Setup*.exe" | Select-Object -First 1
          if ($null -eq $installer) { throw "No NSIS installer found in dist" }
          $app = ./scripts/smoke/install-windows.ps1 -DistDir dist
          "artifact=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "executable=$app" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Smoke test packaged app
        env:
          EXIFCLEANER_PACKAGED_APP: ${{ steps.install.outputs.executable }}
        run: yarn test:smoke

      - name: Write Windows release evidence
        run: yarn release:evidence --artifact "${{ steps.install.outputs.artifact }}" --executable "${{ steps.install.outputs.executable }}" --runner-os windows --runner-arch "${{ runner.arch }}" --smoke-result passed --output release-evidence-windows.json

      - name: Upload Windows release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-windows
          path: release-evidence-windows.json
          retention-days: 7

      - name: Upload smoke report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-windows
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ExifCleaner-Windows
          path: |
            dist/*.exe
          retention-days: 7

  build-linux:
    name: Build Linux
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Linux artifacts
        run: yarn packlinux

      # Same AppArmor workaround the dev E2E job needs — the packaged app runs the
      # same Chromium renderer.
      - name: Disable AppArmor restriction (Ubuntu 24.04)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Extract AppImage
        id: install
        run: |
          ARTIFACT=$(find dist -maxdepth 1 -name "*.AppImage" -print -quit)
          test -n "$ARTIFACT"
          APP=$(scripts/smoke/install-linux.sh "$ARTIFACT" "$RUNNER_TEMP/smoke")
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "executable=$APP" >> "$GITHUB_OUTPUT"

      - name: Smoke test packaged app
        env:
          EXIFCLEANER_PACKAGED_APP: ${{ steps.install.outputs.executable }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" yarn test:smoke

      - name: Write Linux release evidence
        run: yarn release:evidence --artifact "${{ steps.install.outputs.artifact }}" --executable "${{ steps.install.outputs.executable }}" --runner-os linux --runner-arch "${{ runner.arch }}" --smoke-result passed --output release-evidence-linux.json

      - name: Upload Linux release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-linux
          path: release-evidence-linux.json
          retention-days: 7

      - name: Upload smoke report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-linux
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ExifCleaner-Linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          retention-days: 7
