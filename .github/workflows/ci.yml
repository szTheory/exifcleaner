name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel in-progress runs for same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint (Prettier)
        run: yarn lint

      - name: Typecheck (tsc --noEmit)
        run: yarn typecheck

      - name: Unit tests (Vitest)
        run: yarn test

      - name: Check circular dependencies (madge)
        run: yarn check:deps

      - name: Compile (electron-vite build)
        run: yarn compile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Disable AppArmor restriction (Ubuntu 24.04)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: E2E tests (Playwright)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" yarn test:e2e

  build-macos:
    name: Build macOS
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # --publish never lives in the pack script so no caller can forget it.
      - name: Build macOS artifacts
        run: yarn packmac

      # Smoke runs in the SAME job as the build, deliberately.
      # actions/upload-artifact normalizes file modes to 644 and drops symlinks —
      # a .app is largely symlinks (Contents/Frameworks/*/Versions/Current) and
      # would arrive corrupted, producing phantom "damaged" verdicts. Only the
      # sealed .dmg crosses a job boundary.
      - name: Install from DMG
        id: install
        run: |
          APP=$(scripts/smoke/install-macos.sh dist/*arm64.dmg "$RUNNER_TEMP/smoke")
          echo "executable=$APP" >> "$GITHUB_OUTPUT"
          echo "bundle=$(dirname "$(dirname "$APP")")" >> "$GITHUB_OUTPUT"

      # Regression gate for #290. Operates on its own quarantined copy.
      - name: Gatekeeper gate
        run: node scripts/gatekeeper_check.mjs --app "${{ steps.install.outputs.bundle }}"

      - name: Smoke test packaged app
        env:
          EXIFCLEANER_PACKAGED_APP: ${{ steps.install.outputs.executable }}
        run: yarn test:smoke

      # always() so a smoke failure still leaves the artifact for debugging.
      - name: Upload macOS artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ExifCleaner-macOS
          path: dist/*.dmg
          retention-days: 7

      - name: Upload smoke report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-macos
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build-windows:
    name: Build Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Windows artifacts
        run: yarn packwin --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ExifCleaner-Windows
          path: |
            dist/*.exe
          retention-days: 7

  build-linux:
    name: Build Linux
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Linux artifacts
        run: yarn packlinux --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ExifCleaner-Linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          retention-days: 7
