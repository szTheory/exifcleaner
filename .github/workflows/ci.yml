name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress runs for same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Phase 48 (D-04, D-19 step 7, D-20): the repository now pins the published registry
      # version exifcleaner-node@0.2.1, so this step is required to pass unconditionally.
      # `continue-on-error` (Phase 47) is removed here — Phase 47 added it deliberately to
      # keep this CI-linkage structural gate intact while the dependency was non-sealable;
      # that condition no longer holds. This step's run command and its placement
      # immediately after install remain the validated CI-linkage invariant
      # (scripts/exifcleaner_node_dependency_gate.mjs validateCiWorkflowPolicy).
      - name: Seal native dependency
        run: yarn verify:native-dependency:seal

      - name: Verify release-note identity
        run: yarn verify:release-notes

      # Phase 53.1-06 deviation (D-68 CI gap, Rule 3): the Oracle accountability policy
      # step below re-runs tests/e2e/fixtures/generate_fixtures.ts's generateRawFixtures,
      # which reads the bundled ExifTool distribution's own t/images/ corpus from the
      # gitignored exiftool_downloads/ tree (Phase 51.1 commits 1206252/bfc9c1a,
      # RAW-PROVENANCE.md). update_exiftool.pl populates that tree on a maintainer's
      # machine, but this branch's `test` job has never run in CI before this plan, so
      # the tree has never existed on a runner. This step fetches the exact pinned
      # upstream tarball and fails closed if its SHA-256 does not match the digest
      # pinned in update_exiftool.pl:134 / RAW-PROVENANCE.md, before extracting it.
      - name: Fetch RAW fixture upstream source (Phase 53.1 D-68 CI gap)
        run: |
          set -euo pipefail
          mkdir -p exiftool_downloads
          curl -fL --retry 3 \
            --output exiftool_downloads/Image-ExifTool-13.59.tar.gz \
            https://downloads.sourceforge.net/project/exiftool/Image-ExifTool-13.59.tar.gz
          EXPECTED=668ea3acececb7235fbd0f4900e72d5f12c9b07e5c778fd36cb1e9b5828fd65a
          ACTUAL=$(shasum -a 256 exiftool_downloads/Image-ExifTool-13.59.tar.gz | cut -d' ' -f1)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FATAL: Image-ExifTool-13.59.tar.gz SHA-256 mismatch (expected $EXPECTED, got $ACTUAL)" >&2
            exit 1
          fi
          tar -xzf exiftool_downloads/Image-ExifTool-13.59.tar.gz -C exiftool_downloads

      - name: Oracle accountability policy
        run: yarn verify:accountability:policy

      - name: Known-gap gate
        run: yarn verify:known-gaps

      - name: Translation resource drift
        run: yarn i18n:check

      - name: Documentation drift
        run: yarn docs:verify

      - name: Lint (Prettier)
        run: yarn lint

      - name: Typecheck (tsc --noEmit)
        run: yarn typecheck

      # P48-NC-5 (issue #344 vacuity gate): must run before the NC evidence step below,
      # which reads this step's success marker as P48-NC-5's own run-log evidence.
      - name: Issue #344 vacuity gate
        run: yarn verify:issue344-vacuity

      - name: Unit tests (Vitest)
        run: yarn test:ci

      # D-11: proves the six P48-NC controls EXECUTED (not skipped/platform-gated), reading
      # the report the previous step just wrote plus the vacuity gate's evidence marker.
      - name: Issue #344 NC evidence
        run: yarn verify:issue344-nc-evidence
      # always() so the per-test-name run-log evidence (D-27 prerequisite) is
      # preserved even when a test fails, not only on a clean pass.
      - name: Upload Vitest run-log evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-report
          path: vitest-report.json
          retention-days: 7

      # D-27: asserts the nine negative-control titles were actually EXECUTED
      # in the report above, not merely that the suite exited zero. Placed
      # after the upload step (not always()) so the artifact is preserved
      # even when this assertion is what fails, but this step itself gates
      # the pipeline normally.
      - name: Verify negative-control run-log evidence
        run: yarn verify:nc-evidence

      - name: Check circular dependencies (madge)
        run: yarn check:deps

      - name: Directory-effect gate (dir_effect_gate)
        run: yarn verify:direffect

      - name: Compile (electron-vite build)
        run: yarn compile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Disable AppArmor restriction (Ubuntu 24.04)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Orientation mutation accountability
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" yarn verify:accountability:mutation

      - name: E2E tests (Playwright)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" yarn test:e2e

  build-macos:
    name: Build macOS
    needs: test
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # --publish never lives in the pack script so no caller can forget it.
      - name: Build macOS artifacts
        run: yarn packmac

      - name: macOS xattr E2E
        run: yarn playwright test tests/e2e/xattr.spec.ts --project=dev

      # Smoke runs in the SAME job as the build, deliberately.
      # actions/upload-artifact normalizes file modes to 644 and drops symlinks —
      # a .app is largely symlinks (Contents/Frameworks/*/Versions/Current) and
      # would arrive corrupted, producing phantom "damaged" verdicts. Only the
      # sealed .dmg crosses a job boundary.
      - name: Install from DMG
        id: install
        run: |
          ARTIFACT=$(find dist -maxdepth 1 -name "*arm64.dmg" -print -quit)
          test -n "$ARTIFACT"
          APP=$(scripts/smoke/install-macos.sh "$ARTIFACT" "$RUNNER_TEMP/smoke")
          # Strip the executable suffix rather than chaining dirname. $APP is
          # <bundle>.app/Contents/MacOS/<name>, so this needs three dirnames, and a
          # two-dirname version silently yielded ".../ExifCleaner.app/Contents" —
          # which codesign rejects as "bundle format unrecognized", making a healthy
          # build look like the "damaged" failure the gate exists to catch.
          {
            echo "artifact=$ARTIFACT"
            echo "executable=$APP"
            echo "bundle=${APP%/Contents/MacOS/*}"
          } >> "$GITHUB_OUTPUT"

      # Regression gate for #290. Operates on its own quarantined copy.
      - name: Gatekeeper gate
        run: node scripts/gatekeeper_check.mjs --app "${{ steps.install.outputs.bundle }}"

      - name: Smoke test packaged app
        env:
          EXIFCLEANER_PACKAGED_APP: ${{ steps.install.outputs.executable }}
        run: yarn test:smoke

      - name: Write macOS release evidence
        run: yarn release:evidence --artifact "${{ steps.install.outputs.artifact }}" --executable "${{ steps.install.outputs.executable }}" --runner-os macos --runner-arch "${{ runner.arch }}" --smoke-result passed --output release-evidence-macos.json

      - name: Upload macOS release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence-macos
          path: release-evidence-macos.json
          retention-days: 7

      # always() so a smoke failure still leaves the artifact for debugging.
      - name: Upload macOS artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ExifCleaner-macOS
          path: dist/*.dmg
          retention-days: 7

      - name: Upload smoke report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-report-macos
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # PLAT-01 (65-11): the x64 DMG is published for Intel Macs, so it must be installed and
  # smoked on native x86_64 hardware. Smoke-only: it reuses the DMG build-macos already
  # uploaded (no rebuild) and runs a scoped 4-test grep to earn its runner minutes.
  # It uploads nothing matching ExifCleaner-* or release-evidence-* (release.yml promotes
  # those patterns); its only upload is the failure-only report below.
  smoke-macos-intel:
    name: Smoke macOS x64 (Intel)
    needs: build-macos
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download macOS DMGs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ExifCleaner-macOS
          path: ${{ runner.temp }}/macos-dmg

      - name: Prove native Intel runner (PLAT-01)
        run: |
          set -euo pipefail
          ARCH=$(uname -m)
          TRANSLATED=$(sysctl -n sysctl.proc_translated 2>/dev/null || echo 0)
          if [ "$ARCH" != "x86_64" ] || [ "$TRANSLATED" != "0" ]; then
            echo "::error::runner is not native x86_64 (uname -m=$ARCH proc_translated=$TRANSLATED)"
            exit 1
          fi
          echo "RUNNER ARCH: x86_64 native (proc_translated=$TRANSLATED)"

      - name: Install x64 DMG on Intel (PLAT-01, D-07)
        id: install_x64
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./package.json").version')
          ARTIFACT="$RUNNER_TEMP/macos-dmg/ExifCleaner-$VERSION.dmg"
          test -f "$ARTIFACT"
          APP=$(scripts/smoke/install-macos.sh "$ARTIFACT" "$RUNNER_TEMP/smoke-x64")
          BUNDLE="${APP%/Contents/MacOS/*}"
          EXEC_ARCHS=$(lipo -archs "$APP")
          echo "lipo executable: $EXEC_ARCHS"
          if [ "$EXEC_ARCHS" != "x86_64" ]; then
            echo "::error::installed executable archs are '$EXEC_ARCHS', expected exactly x86_64"
            exit 1
          fi
          FOUND_X64_ADDON=0
          while IFS= read -r NODE_FILE; do
            ADDON_ARCHS=$(lipo -archs "$NODE_FILE")
            echo "lipo addon: $NODE_FILE -> $ADDON_ARCHS"
            case "$NODE_FILE" in
              *darwin-x64*) [ "$ADDON_ARCHS" = "x86_64" ] && FOUND_X64_ADDON=1 ;;
            esac
          done < <(find "$BUNDLE/Contents/Resources" -name '*.node' -path '*darwin-*')
          if [ "$FOUND_X64_ADDON" != "1" ]; then
            echo "::error::no darwin-x64 .node addon with archs exactly x86_64 in the bundle"
            exit 1
          fi
          ACTUAL=$(plutil -extract LSMinimumSystemVersion raw "$BUNDLE/Contents/Info.plist")
          EXPECTED=$(node -p 'require("./package.json").build.mac.minimumSystemVersion')
          echo "macOS floor x64: actual=$ACTUAL expected=$EXPECTED"
          if [ "$ACTUAL" != "$EXPECTED" ]; then exit 1; fi
          DMG_SHA=$(shasum -a 256 "$ARTIFACT" | cut -d' ' -f1)
          echo "$DMG_SHA" | grep -Eq '^[0-9a-f]{64}$'
          echo "X64 DMG SHA256 $DMG_SHA"
          {
            echo "artifact=$ARTIFACT"
            echo "executable=$APP"
            echo "bundle=$BUNDLE"
          } >> "$GITHUB_OUTPUT"

      - name: Scoped x64 packaged smoke on Intel (PLAT-01, D-05, D-06)
        env:
          EXIFCLEANER_PACKAGED_APP: ${{ steps.install_x64.outputs.executable }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/x64-smoke.json
        run: |
          set -euo pipefail
          yarn test:smoke --reporter=list,json --grep 'launches and mounts the UI|ships the approved Electron fuse values in the native executable|seeded sample-sips-icc\.(heic|avif) is cleaned by the native engine in the installed artifact'
          node -e '
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync(process.env.PLAYWRIGHT_JSON_OUTPUT_NAME, "utf8"));
            const EXPECT_TOTAL = 4;
            const EXPECT_NATIVE = 2;
            const nativeTitle = /seeded sample-sips-icc\.(heic|avif) is cleaned by the native engine in the installed artifact/;
            const specs = [];
            const walk = (suite) => {
              for (const spec of suite.specs || []) specs.push(spec);
              for (const child of suite.suites || []) walk(child);
            };
            for (const suite of report.suites || []) walk(suite);
            const passed = specs.filter((spec) =>
              (spec.tests || []).length > 0 &&
              spec.tests.every((t) => {
                const last = (t.results || [])[(t.results || []).length - 1];
                return t.status === "expected" && last && last.status === "passed";
              }));
            const native = passed.filter((spec) => nativeTitle.test(spec.title));
            const s = report.stats;
            if (s.unexpected !== 0 || s.flaky !== 0 || s.skipped !== 0 || passed.length !== EXPECT_TOTAL || native.length !== EXPECT_NATIVE) {
              console.error("::error::Intel smoke count mismatch: " + JSON.stringify({ stats: s, passed: passed.length, native: native.length }));
              process.exit(1);
            }
            console.log("X64 NATIVE HEIC/AVIF PASSED: " + native.length);
            console.log("X64 INTEL SMOKE PASSED: " + passed.length + " (launch, fuses, native HEIC, native AVIF on macos-15-intel)");
          '

      - name: Upload Intel smoke report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-report-macos-intel
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build-windows:
    name: Build Windows
    needs: test
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Phase 53.1 D-68: proves the deadline kill ends the exiftool.exe launcher (Perl runs
      # in-process via perl532.dll, no perl.exe child) and releases the output file on a real
      # Windows host. Never asserted without a run.
      - name: Windows process-tree kill proof (LRG-03, D-68)
        run: yarn tsx tests/manual/windows_tree_kill_probe.ts

      - name: Build Windows artifacts
        run: yarn packwin

      # nsis.runAfterFinish:false stops the silent install auto-launching the app;
      # the install script also stops any stray instance. Without both, Playwright's
      # launch becomes a second instance that hangs on the single-instance lock.
      - name: Install from NSIS installer
        id: install
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter "*Setup*.exe" | Select-Object -First 1
          if ($null -eq $installer) { throw "No NSIS installer found in dist" }
          $app = ./scripts/smoke/install-windows.ps1 -DistDir dist
          "artifact=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "executable=$app" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: "TEMPORARY observation (65-11): installer payload, dist dirs, PE machine"
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Get-ChildItem dist -Directory | ForEach-Object { "DIST DIR " + $_.Name }
          $sz = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $sz -and (Test-Path "C:\Program Files\7-Zip\7z.exe")) { $sz = "C:\Program Files\7-Zip\7z.exe" }
          if (-not $sz) { throw "7-Zip not found" }
          "=== 7Z 4.7.0-candidate BEGIN"
          $out = & $sz l -ba "${{ steps.install.outputs.artifact }}"
          if ($LASTEXITCODE -ne 0 -or -not $out) { throw "7z listing failed" }
          $out
          "=== 7Z 4.7.0-candidate END"
          gh release download v4.6.0 --repo szTheory/exifcleaner --pattern "ExifCleaner.Setup.4.6.0.exe" --dir "$env:RUNNER_TEMP\v460"
          "=== 7Z 4.6.0 BEGIN"
          $out2 = & $sz l -ba "$env:RUNNER_TEMP\v460\ExifCleaner.Setup.4.6.0.exe"
          if ($LASTEXITCODE -ne 0 -or -not $out2) { throw "7z 4.6.0 listing failed" }
          $out2
          "=== 7Z 4.6.0 END"
          $bytes = [IO.File]::ReadAllBytes("${{ steps.install.outputs.executable }}")
          $lfanew = [BitConverter]::ToUInt32($bytes, 0x3C)
          if (-not ($bytes[$lfanew] -eq 0x50 -and $bytes[$lfanew+1] -eq 0x45 -and $bytes[$lfanew+2] -eq 0 -and $bytes[$lfanew+3] -eq 0)) { throw "not a PE header" }
          $machine = [BitConverter]::ToUInt16($bytes, $lfanew + 4)
          "PE MACHINE 0x" + $machine.ToString("x4")

      # 48-07 diagnostic (maintainer-authorized, one deliberate dispatch): writes native
      # crash dumps to a local, job-scoped RUNNER_TEMP directory when the packaged app
      # dies. src/main/security/crash_dumps.ts's maybeEnableCrashDumps() is a no-op unless
      # this exact env var is set -- no real user launch or release build ever sets it.
      # uploadToServer:false + empty submitURL (verified by
      # tests/main/security/crash_dumps.test.ts) mean nothing is ever phoned home; the
      # dumps only ever leave this job as the CI artifact uploaded below.
      - name: Smoke test packaged app
        env:
          EXIFCLEANER_PACKAGED_APP: ${{ steps.install.outputs.executable }}
          EXIFCLEANER_CRASH_DUMPS_DIR: ${{ runner.temp }}\crash-dumps
        run: yarn test:smoke

      - name: Write Windows release evidence
        run: yarn release:evidence --artifact "${{ steps.install.outputs.artifact }}" --executable "${{ steps.install.outputs.executable }}" --runner-os windows --runner-arch "${{ runner.arch }}" --smoke-result passed --output release-evidence-windows.json

      - name: Upload Windows release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence-windows
          path: release-evidence-windows.json
          retention-days: 7

      - name: Upload smoke report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-report-windows
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # Diagnostic-only, paired with the crash-dump capture above. Uploads whatever was
      # written to the crash-dumps directory (nothing, if the app never crashed) so a
      # native fault has a real minidump to analyze instead of only a Playwright
      # "context closed" symptom.
      - name: Upload Windows crash dumps
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-crash-dumps
          path: ${{ runner.temp }}\crash-dumps
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ExifCleaner-Windows
          path: |
            dist/*.exe
          retention-days: 7

  build-linux:
    name: Build Linux
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Linux artifacts
        run: yarn packlinux

      # Same AppArmor workaround the dev E2E job needs — the packaged app runs the
      # same Chromium renderer.
      - name: Disable AppArmor restriction (Ubuntu 24.04)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Extract AppImage
        id: install
        run: |
          ARTIFACT=$(find dist -maxdepth 1 -name "*.AppImage" -print -quit)
          test -n "$ARTIFACT"
          APP=$(scripts/smoke/install-linux.sh "$ARTIFACT" "$RUNNER_TEMP/smoke")
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "executable=$APP" >> "$GITHUB_OUTPUT"

      - name: Smoke test packaged app
        env:
          DBUS_SESSION_BUS_ADDRESS: ""
          EXIFCLEANER_PACKAGED_APP: ${{ steps.install.outputs.executable }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" yarn test:smoke

      - name: Write Linux release evidence
        run: yarn release:evidence --artifact "${{ steps.install.outputs.artifact }}" --executable "${{ steps.install.outputs.executable }}" --runner-os linux --runner-arch "${{ runner.arch }}" --smoke-result passed --output release-evidence-linux.json

      - name: Upload Linux release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence-linux
          path: release-evidence-linux.json
          retention-days: 7

      - name: Upload smoke report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-report-linux
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ExifCleaner-Linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          retention-days: 7

  verify-native-evidence:
    name: Verify Native Release Evidence
    needs: [build-macos, smoke-macos-intel, build-windows, build-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Download native release evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-evidence-*
          path: release-evidence
          merge-multiple: true

      - name: Validate complete native evidence set
        run: node scripts/release_evidence.mjs --validate-set release-evidence
