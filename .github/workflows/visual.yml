name: Visual capture

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-capture-${{ github.ref }}
  cancel-in-progress: false

env:
  STORYBOOK_DISABLE_TELEMETRY: "true"
  EXIFCLEANER_VISUAL_IMAGE: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f

jobs:
  capture:
    name: Capture visual evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Record capture environment
        shell: bash
        env:
          EXIFCLEANER_VISUAL_RUNNER: ${{ runner.name }} / ${{ runner.os }} ${{ runner.arch }} ${{ runner.environment }}
        run: |
          set -euo pipefail
          directory="$(mktemp -d "$RUNNER_TEMP/exifcleaner-visual.XXXXXXXX")"
          echo "EXIFCLEANER_VISUAL_OUTPUT_DIR=$directory" >> "$GITHUB_ENV"
          echo "EXIFCLEANER_VISUAL_RUNNER=$EXIFCLEANER_VISUAL_RUNNER" >> "$GITHUB_ENV"

      - name: Capture exact Storybook cases
        run: yarn visual:capture

      - name: Validate the capture artifact
        run: >-
          node scripts/validate_visual_artifact.mjs
          --manifest "$EXIFCLEANER_VISUAL_OUTPUT_DIR/manifest.json"
          --cases .storybook/visual-baselines.json
          --root "$EXIFCLEANER_VISUAL_OUTPUT_DIR"

      - name: Build artifact-only contact sheet
        run: node scripts/contact_sheet.mjs "$EXIFCLEANER_VISUAL_OUTPUT_DIR"

      - name: Upload capture artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-capture
          path: |
            ${{ env.EXIFCLEANER_VISUAL_OUTPUT_DIR }}/*.png
            ${{ env.EXIFCLEANER_VISUAL_OUTPUT_DIR }}/contact-sheet.png
            ${{ env.EXIFCLEANER_VISUAL_OUTPUT_DIR }}/manifest.json
            ${{ env.EXIFCLEANER_VISUAL_OUTPUT_DIR }}/contact-sheet.html
          if-no-files-found: error
          retention-days: 90
