name: Homebrew Cask Status

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report-cask-status:
    name: Report upstream cask status
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Query Homebrew's supported cask metadata
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew info --cask --json=v2 exifcleaner
          echo "ExifCleaner does not mutate homebrew-cask automatically."
          echo "After a stable release, use Homebrew's supported bump flow:"
          echo "https://docs.brew.sh/How-To-Open-a-Homebrew-Pull-Request"
